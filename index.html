<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b22"><title>Raízes — Consciência Negra</title><style>
:root{--gold:#d9b66d;--cream:#f7f0df}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 35%,#31543d,#193b2d 55%,#0b211a);color:var(--cream);font-family:Georgia,serif}header{text-align:center;padding:35px 16px 5px}.k{font:700 11px Arial;letter-spacing:.28em;text-transform:uppercase;color:#e2c47e}h1{font-size:clamp(2.2rem,6vw,4.4rem);line-height:1.02;margin:12px 0;color:#fff4d9;font-weight:500}header p{font:15px/1.6 Arial;color:#d8d6c1;max-width:570px;margin:12px auto}.stage{position:relative;width:min(1000px,100%);height:690px;margin:auto;overflow:hidden}.tree{position:absolute;width:100%;height:100%;inset:0}.card{position:absolute;width:clamp(126px,16vw,174px);min-height:105px;transform:translate(-50%,-50%);border:1px solid #d7b66e;border-radius:12px;background:linear-gradient(145deg,#fff9e9,#ead8ad);color:#342b1e;padding:13px 12px;text-align:center;box-shadow:0 12px 28px #06150f66;font:600 13px/1.38 Arial;cursor:pointer;transition:transform .2s,box-shadow .2s;z-index:3}.card:before{content:"";position:absolute;height:25px;width:1px;background:#d7b66e;left:50%;top:-26px}.card:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#d7b66e;left:calc(50% - 4px);top:-30px}.card:hover,.card:focus-visible{transform:translate(-50%,-50%) scale(1.06);box-shadow:0 16px 35px #06150faa;outline:2px solid #f0d38c;outline-offset:3px}.tag{display:block;margin-top:8px;color:#98733c;font:700 9px Arial;letter-spacing:.16em;text-transform:uppercase}.c1{left:15%;top:42%}.c2{left:33%;top:23%}.c3{left:51%;top:17%}.c4{left:69%;top:24%}.c5{left:86%;top:43%}.c6{left:25%;top:66%}.c7{left:75%;top:66%}.base{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);width:60%;height:22px;border-radius:50%;background:#06160f88;filter:blur(9px)}footer{text-align:center;padding:0 18px 32px;color:#d3d0b9;font:12px/1.7 Arial}footer strong{color:#e4c47b}.backdrop{position:fixed;inset:0;background:#06150fc9;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.backdrop.show{display:flex}.dialog{position:relative;max-width:470px;width:100%;padding:34px 28px 30px;border-radius:18px;border:1px solid #d8b86e;background:linear-gradient(145deg,#fff9eb,#eee0bd);color:#342b1e;text-align:center;box-shadow:0 25px 80px #0008}.dialog h2{font-size:25px;line-height:1.25;font-weight:500;margin:12px 0}.dialog p{font:15px/1.7 Arial;color:#62543e;margin:0}.close{position:absolute;right:12px;top:10px;border:0;background:transparent;font-size:28px;color:#5d4a30;cursor:pointer}@media(max-width:650px){header{padding-top:26px}.stage{height:610px;max-width:520px}.card{width:clamp(105px,29vw,135px);min-height:92px;padding:10px 8px;font-size:11px}.tag{font-size:8px}.c1{left:16%;top:39%}.c2{left:34%;top:23%}.c3{left:56%;top:19%}.c4{left:79%;top:32%}.c5{left:84%;top:55%}.c6{left:20%;top:61%}.c7{left:67%;top:72%}}@media(max-width:370px){.stage{height:580px}.card{width:104px;font-size:10px}.c1{left:15%}.c5{left:84%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><div class="k">Memória · identidade · respeito</div><h1>Raízes da<br>Consciência Negra</h1><p>Uma árvore de ideias para reconhecer histórias, celebrar culturas e cultivar igualdade.</p></header><main class="stage" aria-label="Árvore com sete cartões interativos"><svg class="tree" viewBox="0 0 1000 690" role="img" aria-label="Árvore frondosa com tronco e galhos"><defs><linearGradient id="wood" x1="0" x2="1"><stop stop-color="#573923"/><stop offset=".48" stop-color="#a87545"/><stop offset="1" stop-color="#573923"/></linearGradient><radialGradient id="crown"><stop stop-color="#83a45a"/><stop offset="1" stop-color="#355d3d"/></radialGradient></defs><ellipse cx="500" cy="365" rx="330" ry="245" fill="url(#crown)" opacity=".2"/><g fill="none" stroke="#8c603b" stroke-linecap="round" stroke-linejoin="round"><path d="M472 650 C440 560 465 480 474 405 C480 330 442 268 380 208 M516 650 C548 555 518 472 526 400 C532 326 576 270 638 210" stroke="url(#wood)" stroke-width="48"/><path d="M493 465 C405 405 335 340 245 310 M504 435 C594 376 666 324 765 293 M472 380 C396 315 360 245 345 170 M530 372 C590 300 624 236 648 157 M478 330 C430 270 415 218 420 145 M535 325 C585 265 603 210 590 145" stroke-width="24"/><path d="M485 625 C420 634 380 658 340 675 M515 625 C580 635 620 657 660 675 M492 625 C470 658 458 670 440 680 M508 625 C530 658 544 670 560 680" stroke-width="16"/></g><g fill="#527b48" stroke="#294d35" stroke-width="2"><ellipse cx="270" cy="280" rx="125" ry="88"/><ellipse cx="370" cy="190" rx="135" ry="100"/><ellipse cx="500" cy="155" rx="150" ry="105"/><ellipse cx="640" cy="190" rx="135" ry="100"/><ellipse cx="745" cy="280" rx="125" ry="88"/><ellipse cx="365" cy="310" rx="130" ry="88"/><ellipse cx="635" cy="310" rx="130" ry="88"/><ellipse cx="500" cy="265" rx="165" ry="115"/></g><g fill="#91a85b" opacity=".85"><ellipse cx="300" cy="236" rx="29" ry="14" transform="rotate(-25 300 236)"/><ellipse cx="390" cy="145" rx="30" ry="14" transform="rotate(20 390 145)"/><ellipse cx="510" cy="105" rx="32" ry="15"/><ellipse cx="650" cy="150" rx="30" ry="14" transform="rotate(-20 650 150)"/><ellipse cx="720" cy="245" rx="28" ry="14" transform="rotate(25 720 245)"/><ellipse cx="405" cy="285" rx="29" ry="14"/><ellipse cx="600" cy="285" rx="29" ry="14"/></g><g fill="#d5b66e"><circle cx="330" cy="205" r="5"/><circle cx="470" cy="125" r="5"/><circle cx="615" cy="205" r="5"/><circle cx="700" cy="300" r="5"/></g></svg><div class="base"></div>
<button class="card c1" data-title="Nossa história é feita de força, cultura e resistência." data-info="A história negra é muito mais ampla que a escravidão: reúne civilizações, conhecimentos, arte, protagonismo e lutas por liberdade.">Nossa história é feita de força, cultura e resistência.<span class="tag">Memória</span></button><button class="card c2" data-title="Respeitar as diferenças é construir um mundo melhor." data-info="Respeito significa reconhecer a dignidade de cada pessoa e garantir que ninguém seja discriminado por sua cor ou origem.">Respeitar as diferenças é construir um mundo melhor.<span class="tag">Respeito</span></button><button class="card c3" data-title="Consciência Negra é reconhecer, valorizar e respeitar." data-info="É conhecer a história e as contribuições da população negra e assumir o compromisso de combater o racismo.">Consciência Negra é reconhecer, valorizar e respeitar.<span class="tag">Consciência</span></button><button class="card c4" data-title="Nossas raízes representam nossa história e identidade." data-info="Ancestralidade é memória viva: saberes, tradições e experiências transmitidos entre gerações.">Nossas raízes representam nossa história e identidade.<span class="tag">Ancestralidade</span></button><button class="card c5" data-title="O racismo não deve ter espaço na sociedade." data-info="Enfrentar o racismo exige atitudes concretas: ouvir, aprender, denunciar discriminações e defender direitos iguais.">O racismo não deve ter espaço na sociedade.<span class="tag">Antirracismo</span></button><button class="card c6" data-title="Igualdade é um direito de todos." data-info="Uma sociedade justa oferece dignidade, oportunidades e proteção sem discriminação.">Igualdade é um direito de todos.<span class="tag">Direitos</span></button><button class="card c7" data-title="A cultura negra faz parte da identidade brasileira." data-info="A música, a literatura, a culinária, a dança, as religiões, as artes e os saberes afro-brasileiros são fundamentais para compreender o Brasil.">A cultura negra faz parte da identidade brasileira.<span class="tag">Cultura</span></button></main><footer><strong>20 de novembro · Dia da Consciência Negra</strong><br>Valorizar a história é também transformar o presente e construir o futuro.</footer><div class="backdrop" id="backdrop" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><section class="dialog"><button class="close" id="close" aria-label="Fechar">×</button><div style="font-size:28px">✊🏿</div><h2 id="dialogTitle"></h2><p id="dialogInfo"></p></section></div><script>const b=document.querySelector('#backdrop'),t=document.querySelector('#dialogTitle'),i=document.querySelector('#dialogInfo');document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{t.textContent=c.dataset.title;i.textContent=c.dataset.info;b.classList.add('show');document.querySelector('#close').focus()}));function close(){b.classList.remove('show')}document.querySelector('#close').addEventListener('click',close);b.addEventListener('click',e=>{if(e.target===b)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});</script></body></html>
